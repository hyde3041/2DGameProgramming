<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>던전 원정대 · 대기 모션</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,sans-serif;background:light-dark(#f3f5f7,#1c2027);color:light-dark(#202832,#f0f2f6)}
    body{max-width:1000px;margin:0 auto;padding:20px}
    .controls{display:flex;align-items:end;flex-wrap:wrap;gap:14px;margin-bottom:12px}
    label{display:grid;gap:6px}select,button{font:inherit;padding:9px 14px;min-height:42px;border:1px solid light-dark(#c4cbd3,#647080);border-radius:8px;background:light-dark(#fff,#2b323b);color:inherit}
    .views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}figure{margin:0;text-align:center;min-width:0}canvas{display:block;width:100%;height:auto;aspect-ratio:1}figcaption{margin-top:4px}
    #status{min-height:1.5em;margin:12px 0;color:light-dark(#465364,#c5cfdd)}
    @media(max-width:520px){.views{grid-template-columns:1fr}body{padding:12px}}
  </style>
</head>
<body>
<main id="idle-motion-v3">
  <div class="controls">
    <label for="character">캐릭터<select id="character"><option value="swordsman">검사</option>
<option value="guardian">수호기사</option>
<option value="archer">궁수</option>
<option value="crossbowman">석궁병</option>
<option value="cleric">성직자</option>
<option value="herbalist">약초사</option>
<option value="frost-mage">냉기술사</option>
<option value="shadow-thief">그림자 도적</option></select></label>
    <button type="button" id="play">일시정지</button>
  </div>
  <div class="views">
    <figure><canvas width="320" height="320" role="img" aria-label="정면 대기 모션"></canvas><figcaption>앞</figcaption></figure>
    <figure><canvas width="320" height="320" role="img" aria-label="뒷면 대기 모션"></canvas><figcaption>뒤</figcaption></figure>
    <figure><canvas width="320" height="320" role="img" aria-label="옆면 대기 모션"></canvas><figcaption>옆</figcaption></figure>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</main>

/* Animate a complete painted sprite so its proportions and occlusion stay intact. */
function createIdleMotionPlayer(canvases, options = {}) {
  const surface = document.createElement('canvas');
  surface.width = surface.height = 320;
  const gl = surface.getContext('webgl', {
    alpha: true, premultipliedAlpha: false, antialias: false, preserveDrawingBuffer: true
  });
  if (!gl) throw new Error('WebGL is unavailable. Use the MP4 or GIF preview.');
  const vertexSource = `
    precision highp float;
    attribute vec2 a_pixel;
    uniform float u_phase;
    uniform float u_view;
    uniform vec3 u_body;
    uniform vec4 u_hair;
    uniform vec3 u_hairMotion;
    uniform vec4 u_cloth;
    varying vec2 v_uv;
    float zone(vec2 p, vec4 z) {
      return 1.0-smoothstep(0.3,1.0,length((p-z.xy)/z.zw));
    }
    void main() {
      vec2 p=a_pixel;
      float breath=(1.0-cos(u_phase))*0.5;
      float upper=1.0-smoothstep(u_body.y,u_body.z,p.y);
      vec2 displacement=vec2(0.12*sin(u_phase),-0.35*breath)*upper;
      float feet=1.0-smoothstep(255.0,270.0,p.y);
      // Roots stay attached; the tips lag behind and swing farther sideways.
      float hairTip=smoothstep(0.0,1.0,clamp((p.y-u_hairMotion.y)/(u_hairMotion.z-u_hairMotion.y),0.0,1.0));
      float hairLag=0.45+0.9*hairTip;
      float hairWave=sin(u_phase)*(1.0+0.25*sin(u_phase-hairLag));
      float clothTip=smoothstep(u_cloth.y-u_cloth.w*0.75,u_cloth.y+u_cloth.w*0.35,p.y);
      float clothLag=0.85+0.6*clothTip;
      float clothWave=sin(u_phase)*(1.0+0.25*sin(u_phase-clothLag));
      displacement.x+=u_hairMotion.x*hairWave*hairTip*zone(p,u_hair)*feet;
      displacement.x+=2.8*clothWave*clothTip*zone(p,u_cloth)*feet;
      vec2 position=p+displacement;
      gl_Position=vec4(position.x/160.0-1.0,1.0-position.y/160.0,0.0,1.0);
      v_uv=vec2((a_pixel.x+u_view*320.0)/960.0,a_pixel.y/320.0);
    }`;
  const fragmentSource = `
    precision highp float;
    uniform sampler2D u_image;
    varying vec2 v_uv;
    void main(){gl_FragColor=texture2D(u_image,v_uv);}`;
  function shader(type, source) {
    const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const program=gl.createProgram();
  gl.attachShader(program,shader(gl.VERTEX_SHADER,vertexSource));
  gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragmentSource));
  gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const divisions=40,vertices=[],indices=[];
  for(let y=0;y<=divisions;y++)for(let x=0;x<=divisions;x++)vertices.push(x*320/divisions,y*320/divisions);
  for(let y=0;y<divisions;y++)for(let x=0;x<divisions;x++){
    const a=y*(divisions+1)+x,b=a+1,c=a+divisions+1,d=c+1;
    indices.push(a,c,b,b,c,d);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);
  const attribute=gl.getAttribLocation(program,'a_pixel');
  gl.enableVertexAttribArray(attribute);gl.vertexAttribPointer(attribute,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(indices),gl.STATIC_DRAW);
  const locations=Object.fromEntries(['phase','view','body','hair','hairMotion','cloth'].map(name=>[name,gl.getUniformLocation(program,'u_'+name)]));
  const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.uniform1i(gl.getUniformLocation(program,'u_image'),0);
  gl.viewport(0,0,320,320);
  const buffers=canvases.map(()=>{const c=document.createElement('canvas');c.width=c.height=320;return c;});
  let rig=null;
  function render(seconds){
    if(!rig)return;
    const phase=(((seconds%2)+2)%2)*Math.PI;
    gl.uniform1f(locations.phase,phase);
    for(let view=0;view<3;view++){
      const setting=rig.views[view];
      gl.uniform1f(locations.view,view);
      gl.uniform3fv(locations.body,setting.body);
      gl.uniform4fv(locations.hair,setting.hair);
      gl.uniform3fv(locations.hairMotion,setting.hair_motion);
      gl.uniform4fv(locations.cloth,setting.cloth);
      gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawElements(gl.TRIANGLES,indices.length,gl.UNSIGNED_SHORT,0);
      const ctx=buffers[view].getContext('2d',{willReadFrequently:true});
      ctx.clearRect(0,0,320,320);ctx.drawImage(surface,0,0);
      const canvas=canvases[view],dest=canvas.getContext('2d',{willReadFrequently:true});
      dest.clearRect(0,0,canvas.width,canvas.height);
      dest.drawImage(buffers[view],...(options.crop||[0,0,320,320]),0,0,canvas.width,canvas.height);
    }
  }
  return {
    buffers,render,cycleSeconds:2,
    setCharacter(image,nextRig){
      gl.bindTexture(gl.TEXTURE_2D,texture);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);
      rig=nextRig;render(0);
    }
  };
}

  let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,lastTime=null,version=0,player;
  try{player=createIdleMotionPlayer([...root.querySelectorAll('canvas')],{crop:[48,96,224,224]});}
  catch(error){status.textContent='이 브라우저에서는 동영상 또는 GIF 미리보기를 열어주세요.';console.error(error);return;}
  root.rigPlayer=player;
  function label(){button.textContent=playing?'일시정지':'재생';button.setAttribute('aria-pressed',String(playing));}
  async function choose(id){
    if(!rigs[id])return;
    const current=++version;
    if(!images[id]){const img=new Image();img.src=sources[id];images[id]=img;}
    await images[id].decode();
    if(current!==version)return;
    select.value=id;time=0;lastTime=null;player.setCharacter(images[id],rigs[id]);root.dataset.character=id;label();status.textContent='';
  }
  root.chooseCharacter=choose;
  root.setPlaying=value=>{playing=value;lastTime=null;label();};
  root.renderAt=seconds=>{time=seconds;player.render(time);};
  select.addEventListener('change',()=>choose(select.value));
  button.addEventListener('click',()=>{playing=!playing;lastTime=null;label();});
  choose('archer');
  function tick(now){
    if(lastTime!==null&&playing&&!document.hidden)time=(time+Math.min(now-lastTime,100)/1000)%2;
    lastTime=now;
    if(playing){player.render(time);root.dataset.time=time.toFixed(3);}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
